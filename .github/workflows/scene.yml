name: Living scene
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yuki4266/living-scene@v1
        with:
          lat: "33.7878"          # your coordinates
          lon: "-117.8531"
          tz: "America/Los_Angeles"  # your timezone
          header: "footer.svg"    # the banner from step 1
          sky: "false" 
